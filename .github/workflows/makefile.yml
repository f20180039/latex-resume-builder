name: Build Resume PDFs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PORTFOLIO_REPO_TOKEN: ${{ secrets.PORTFOLIO_REPO_TOKEN }}
      PORTFOLIO_REPOSITORY: f20180039/anshuman-singh
      PORTFOLIO_RESUME_DIR: public/resume
      PORTFOLIO_META_FILE: src/common/resume-meta.json

    steps:
      - name: Checkout resume repo
        uses: actions/checkout@v4

      - name: Install TinyTeX
        run: |
          curl -sL https://yihui.org/tinytex/install-unx.sh | sh
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Install LaTeX packages
        run: |
          tlmgr install \
            accsupp \
            babel-english \
            enumitem \
            extsizes \
            fontawesome \
            fontspec \
            footmisc \
            geometry \
            graphics \
            hyphenat \
            hyperref \
            ragged2e \
            titlesec \
            tools \
            xcolor

      - name: Build resume PDFs
        run: |
          make -B
          make -B single-col

      - name: Upload built PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            Anshuman_Singh_4FE.pdf
            variants/resume-single-col.pdf

      - name: Warn if the portfolio push is not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PORTFOLIO_REPO_TOKEN == ''
        run: |
          echo "::warning title=Portfolio not updated::PORTFOLIO_REPO_TOKEN is not set, so the built PDFs were not pushed to ${PORTFOLIO_REPOSITORY}. The published resume will stay on its previous version. Add the secret to re-enable the push."
          {
            echo "### ⚠️ Portfolio not updated"
            echo ""
            echo "\`PORTFOLIO_REPO_TOKEN\` is not set on this repository, so the"
            echo "three portfolio steps below were skipped and the published"
            echo "resume is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout portfolio repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PORTFOLIO_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PORTFOLIO_REPOSITORY }}
          token: ${{ env.PORTFOLIO_REPO_TOKEN }}
          path: portfolio

      - name: Copy resume PDFs into portfolio
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PORTFOLIO_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          mkdir -p "portfolio/${PORTFOLIO_RESUME_DIR}"

          # Filenames are self-describing because they are what a recruiter
          # ends up with in their Downloads folder when the browser's built-in
          # PDF viewer handles the download and ignores the anchor's
          # `download` attribute. Keep these in sync with C_RESUME_*_URL in
          # the portfolio's src/common/constants/index.tsx.
          cp Anshuman_Singh_4FE.pdf \
            "portfolio/${PORTFOLIO_RESUME_DIR}/Anshuman-Singh-Frontend-Engineer-Resume.pdf"
          cp variants/resume-single-col.pdf \
            "portfolio/${PORTFOLIO_RESUME_DIR}/Anshuman-Singh-Frontend-Engineer-Resume-Single-Column.pdf"

          # Drives the month suffix on the downloaded filename.
          printf '{\n  "updatedAt": "%s"\n}\n' "$(date -u +%Y-%m-%d)" \
            > "portfolio/${PORTFOLIO_META_FILE}"

      - name: Commit and push portfolio updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PORTFOLIO_REPO_TOKEN != ''
        working-directory: portfolio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PORTFOLIO_RESUME_DIR}" "${PORTFOLIO_META_FILE}"

          if git diff --staged --quiet; then
            echo "Portfolio already has these PDFs; nothing to push."
            exit 0
          fi

          git commit -m "chore: update resume PDFs from latex-resume-builder"

          # Rebase and retry: the portfolio's master moves independently, and a
          # plain push is rejected as non-fast-forward if anything landed while
          # this job was compiling LaTeX.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing."
            git pull --rebase
          done

          echo "::error::Could not push to the portfolio after 3 attempts."
          exit 1
